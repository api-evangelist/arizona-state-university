- date: '2026-09-01'
  rating: 4
  summary: 'Re-profiled under the API Evangelist university pipeline, which settles operator attribution
    before crediting any surface. Eight institution-operated surfaces verified by live probe, plus one
    federation registration and three registry memberships. Two OAI-PMH repositories missed by the June
    2026 review were found: KEEP and PRISM, both ASU Library Islandora deployments developed in public
    at github.com/asulibraries. ASU''s Shibboleth SAML 2.0 Identity Provider was found registered in InCommon
    under entityID urn:mace:incommon:asu.edu and serving its own signed metadata from shibboleth2.asu.edu
    -- the strongest institution-operated surface in the profile and entirely absent from the June review.
    The course catalog was re-read from its SPA bundle rather than its 391-byte shell, revealing an ASU-built
    and ASU-hosted catalog-microservices API that is live but OAuth-gated (401). No tenant relationship
    and no vendor contract is held under this slug; the Dataverse and Islandora deployments are ASU''s,
    their product specifications are the upstream projects'' and are deliberately not saved. One pointer
    recorded in June has since died and was replaced. Five of twelve education-regime domain standards
    are evidenced: oai-pmh, shibboleth, saml, datacite, crossref.'
  endpoints:
  - url: https://shibboleth2.asu.edu/idp/shibboleth
    status: 200
    note: ASU's own Shibboleth IdP metadata endpoint, 1559 bytes application/xml.
