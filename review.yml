  summary: Verified ASU's strongest public, documented API surface is its Library Research Data Repository
    running Dataverse 6.10.1, with a live native REST API (info/version, search) and a live OAI-PMH 2.0
    endpoint (repositoryName "ASU Library Research Data Repository Dataverse OAI Archive"). The public
    course catalog/class search resolves but has no officially documented public API. CAS/Shibboleth SSO
    infrastructure is live but gated to approved service providers. The official GitHub org (github.com/ASU)
    exists and hosts the Unity design system and Drupal tooling. No fabricated endpoints; every URL below
    was probed live.
