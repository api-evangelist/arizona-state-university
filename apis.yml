---
aid: arizona-state-university
name: Arizona State University
description: >-
  Arizona State University (ASU) is a large public research university based in Tempe, Arizona,
  United States, and one of the largest by enrolment in the country. Its programmable footprint is
  real but narrow, and almost none of it is presented as a developer product. ASU operates no public
  developer portal, no self-service API keys and no open data portal — api.asu.edu, data.asu.edu,
  open.asu.edu and developer.asu.edu do not resolve. What it does operate, verified by live probe on
  2026-09-01, is an identity and metadata layer: a Shibboleth SAML 2.0 Identity Provider registered
  in the InCommon Federation under entityID urn:mace:incommon:asu.edu, serving its own signed
  metadata from shibboleth2.asu.edu; a CAS single sign-on service at weblogin.asu.edu; and THREE
  independent OAI-PMH 2.0 repositories on ASU's own hosts — the Library Research Data Repository
  (a self-built Dataverse, build string asu-6.11-oai-rights, 104 datasets under DOI prefix
  10.48349/ASU) plus KEEP and PRISM, the ASU Library Islandora deployments developed in public at
  github.com/asulibraries. ASU also runs its own course-catalog microservices API and a myASU data
  platform on its own hosts, but both are OAuth-gated and undocumented for outside developers. It is
  a registrant in DataCite (member ASU, repository ASU.ASUL), Crossref (member 37851, prefix
  10.58875) and ROR (03efmqc40). No vendor contract is held under this slug: the repository software
  ASU runs is open source and self-hosted, and the specification for it belongs to the projects that
  wrote it, not to ASU.
