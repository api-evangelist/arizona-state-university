x-coverage:
  state: covered
  reason: covered
  detail: >-
    Eight institution-operated surfaces were found and verified by live probe on 2026-09-01, plus one
    federation registration and three registry memberships. Four are anonymously callable right now:
    the ASU Dataverse read API and the OAI-PMH 2.0 endpoints of ASU Dataverse, KEEP and PRISM — the
    last two entirely new to this profile, both ASU Library Islandora deployments developed in public
    at github.com/asulibraries. Four more are live but closed: the Shibboleth IdP (protocol-gated by
    design), CAS WebAuth (401), the ASU-built course-catalog microservices API (401, discovered by
    reading the public SPA bundle rather than the 391-byte SPA shell) and the myASU data platform
    (live JSON host, no public entry point). ZERO tenant surfaces and ZERO vendor contracts are held
    under this slug. The repository software ASU runs — Dataverse and Islandora — is open source and
    self-hosted on ASU's own domains from ASU-local builds (the Dataverse version string is
    "6.11 asu-6.11-oai-rights"), so the deployments are ASU's while the product specifications are
    the upstream projects' and are deliberately not saved here. The profile is thin on OpenAPI
    because ASU publishes none, not because the probe was thin: api.asu.edu, data.asu.edu,
    open.asu.edu, developer.asu.edu and status.asu.edu do not resolve, there is no developer portal
    and no self-service key anywhere on the estate. Five of the twelve education-regime domain
    standards are evidenced — oai-pmh, shibboleth, saml, datacite, crossref — every one of them on a
    host ASU operates or in a registry ASU is registered in. Two edge behaviours are recorded rather
    than mistaken for outages: dataverse.asu.edu and keep.lib.asu.edu serve a 403 "ASU error page" to
    a scripted User-Agent on their HTML paths while their API and OAI paths return 200, and one
    previously recorded documentation pointer (getprotected.asu.edu .../authentication-services) has
    gone to a hard 403 "Access denied" and was replaced from the site's own sitemap.
  assessed: '2026-09-01'
  method: pipeline-university + live probe
  institution_surfaces: 8
  tenant_surfaces: 0
  federation_surfaces: 1
  registry_surfaces: 3
