apis:
  - aid: arizona-state-university:shibboleth-idp
    name: ASU Shibboleth SAML 2.0 Identity Provider
    description: >-
      ASU's own Shibboleth Identity Provider, entityID urn:mace:incommon:asu.edu, asserting the
      scope asu.edu. ASU publishes the signed entity descriptor from its own host at
      shibboleth2.asu.edu (200, 1559 bytes, application/xml) as well as through the InCommon MDQ
      service. Advertises SAML 2.0 over HTTP-Redirect and HTTP-POST SingleSignOnService bindings,
      with mdui:UIInfo carrying the institution's display name, information URL and privacy
      statement. Institution-operated by definition, machine-readable, and the single most
      under-catalogued programmable asset a university runs. It is not a public developer API: an
      application cannot obtain an assertion without being registered as a service provider in the
      federation.
    humanURL: https://getprotected.asu.edu/services
    baseURL: https://shibboleth2.asu.edu/idp/shibboleth
    tags: [ Identity, SSO, SAML, Shibboleth, Federation, InCommon ]
    properties:
      - type: Authentication
        url: authentication/arizona-state-university-authentication.yml
      - type: IdentityFederation
        url: https://mdq.incommon.org/entities/urn%3Amace%3Aincommon%3Aasu.edu
      - type: Conformance
        url: conformance/arizona-state-university-conformance.yml
    x-operator: institution
    x-operator-evidence: >-
      The signed EntityDescriptor names OrganizationName "Arizona State University" and shibmd:Scope
      "asu.edu"; the metadata is served from shibboleth2.asu.edu, ASU's own registrable domain, and
      the SSO bindings point at the same host.
    x-entity-id: urn:mace:incommon:asu.edu
    x-sso-endpoint: https://shibboleth2.asu.edu/idp/profile/SAML2/Redirect/SSO
    x-probe:
      baseURL_status: 200
      probed: '2026-09-01'
      note: >-
        1559 bytes of application/xml SAML metadata from ASU's own host. The SSO endpoint itself is
        not a pointer — it requires a SAMLRequest — so it is recorded in x-sso-endpoint.
  - aid: arizona-state-university:incommon-federation-registration
    name: InCommon Federation registration (urn:mace:incommon:asu.edu)
    description: >-
      ASU's registration in the InCommon Federation, retrievable as signed SAML metadata from the
      InCommon MDQ service and flowing onward into eduGAIN. This is the federation-operated copy of
      the record whose IdP ASU itself runs; it is recorded here because it is the machine-readable
      location an outside agent can actually resolve without knowing ASU's internal hostnames.
    humanURL: https://spaces.at.internet2.edu/display/federation/metadata-service
    baseURL: https://mdq.incommon.org/entities/urn%3Amace%3Aincommon%3Aasu.edu
    tags: [ Identity Federation, InCommon, eduGAIN, SAML, Metadata ]
    properties:
      - type: IdentityFederation
        url: https://mdq.incommon.org/entities/urn%3Amace%3Aincommon%3Aasu.edu
      - type: Authentication
        url: authentication/arizona-state-university-saml-idp-metadata.xml
      - type: Documentation
        url: https://spaces.at.internet2.edu/display/federation/metadata-service
    x-operator: federation
    x-operator-evidence: >-
      mdq.incommon.org is InCommon's aggregate, shared by every member by definition — a federation
      is not a vendor and this entry is not a misattribution. The entity it carries is ASU's own IdP.
